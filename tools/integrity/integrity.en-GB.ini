; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Installation incomplete: %1$d of %2$d files are missing or damaged."
CS_INTEGRITY_PROBLEMS_BODY="%s did not install completely, so parts of it may not work. Install the same package again to repair it. If the install fails again, security software on the server (for example Imunify360 Proactive Defense) may be blocking Joomla's installer: check its incident log."
