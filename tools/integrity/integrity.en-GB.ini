CS_INTEGRITY_CHANGED_BODY="This happens after a failed update, or when someone edits the files of %s directly. Install the same package again to restore them."
CS_INTEGRITY_OK="All %1$d files match the released version."
CS_INTEGRITY_NOLIST="This build has no file list, so the file check is unavailable."
